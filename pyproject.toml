[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mikhail-training"
version = "0.1.0"
description = "Домашние задания курса по ИИ: общая база (core/common) + пакет на каждое задание"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Alex Lan", email = "ltestai73@gmail.com" }
]

# Базовый каркас (core/common/homework/hw00) работает на чистой стандартной библиотеке —
# зависимостей нет намеренно, чтобы `python run_hw.py hw00` заводился где угодно.
dependencies = []

[project.optional-dependencies]
# Численный/табличный стек — нужен большинству ДЗ курса.
ml = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
]
# Ноутбуки (если ДЗ требует ipynb).
nb = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]
# Глубокое обучение. torch+ROCm НЕ ставится через PyPI — только из офлайн-пака (cp312),
# см. .claude/rules/05-python-style.md «torch / GPU».
dl = [
    "torch>=2.4",
]
# hw01 «Markdown / Git Scanner»: разбор Markdown, обход git-репозиториев, чтение mdscan.yaml.
# rich — опционально (есть fallback на plain-вывод), поэтому в extra не входит.
hw01 = [
    "markdown-it-py>=3.0",
    "linkify-it-py>=2.0",      # пресет gfm-like: голые URL как ссылки (без него linkify гасится с WARNING)
    "mdit-py-plugins>=0.4",
    "GitPython>=3.1",
    "PyYAML>=6.0",
    "rich>=13.0",              # цветная консоль/прогресс; без него — plain-fallback
]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "common*", "homework*"]
exclude = ["tests*", "MemoryBank*", "Doc*", "data*", "out*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET"]
ignore = ["E501"]   # длинные строки разрешены для коммент-блоков

[tool.pytest.ini_options]
# Стандарт тестирования проекта — pytest (см. .claude/rules/04-testing-python.md).
# Legacy-наборы на common.runner.TestRunner лежат в tests/ и НЕ собираются pytest'ом:
# их классы называются `*Tests`, а не `Test*` — гоняются через `python tests/all_test.py`.
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
